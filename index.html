<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<div class="card">
    <div class="search">
        <input type="text" placeholder="Enter city name" spellcheck="false">
        <button><img src="images/search.png"></button>
    </div>
    <div class="error">
        <p>Invald city name</p>
    </div>
    <div class="weather">
        <img src="images/rain.png" class="weather-icon">
        <h1 class="temperature">25°C</h1>
        <h2 class="city">New York</h2>
        <div class="details">
            <div class="col">
                <img src="images/humidity.png">
                <p class="humidity">60%</p>
                <p>Humidity</p>
            </div>
            <div class="col">
                <img src="images/wind.png">
                <p class="wind">10 km/h</p>
                <p>Wind Speed</p>
            </div>
        </div>
        
    </div>
</div>

<script>


const apikey = "44d0b1d638b234065fac44d9a6374062";
const apiUrl = "https://api.openweathermap.org/data/2.5/weather?units=metric&appid=";

const searchBox = document.querySelector(".search input");
const searchBtn = document.querySelector(".search button");
const weatherIcon = document.querySelector(".weather-icon"); 


async function checkWeather(city) {
    const respone = await fetch(apiUrl + apikey + "&q=" + city);

    if(respone.status == 404){
        document.querySelector("error").style.display = "block"
        document.querySelector(".weather").style.display = "none"
    }else{

         var data = await respone.json();


    document.querySelector(".city").innerHTML = data.name;
    document.querySelector(".temperature").innerHTML = Math.round(data.main.temp) + "°C";
    document.querySelector(".humidity").innerHTML = data.main.humidity + "%";
    document.querySelector(".wind").innerHTML = data.wind.speed + " km/h";

    if(data.weather[0].main == "clouds") {
        document.querySelector(".weather-icon").src = "images/cloud.png";
    } else if(data.weather[0].main == "Clear") {
        document.querySelector(".weather-icon").src = "images/clear.png";
    } else if(data.weather[0].main == "Rain") {
        document.querySelector(".weather-icon").src = "images/rain.png";
    } else if(data.weather[0].main == "Drizzle") {
        document.querySelector(".weather-icon").src = "images/drizzle.png";
    } else if(data.weather[0].main == "Mist") {
        document.querySelector(".weather-icon").src = "images/mist.png";
    }

    document.querySelector(".weather").style.display = "block";
     document.querySelector(".error").style.display = "none";


    }

   
}


searchBtn.addEventListener("click", () => {
    checkWeather(searchBox.value);
});


</script>


</body>
</html>
